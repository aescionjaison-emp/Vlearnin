name: Deploy VLEARNIN Web to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package and static web export
        env:
          FIREBASE_EXPORT: "true"
        run: |
          pnpm --filter @vlearnin/shared build
          pnpm --filter @vlearnin/web build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > "${{ runner.temp }}/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="${{ runner.temp }}/firebase-sa.json"
            npx firebase-tools deploy --only hosting --project vlearnin --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools deploy --only hosting --project vlearnin --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "Missing FIREBASE_SERVICE_ACCOUNT or FIREBASE_TOKEN secret in GitHub repository settings."
            exit 1
          fi
